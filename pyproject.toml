[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "octopus-allocation"
version = "0.1.0"
description = "RL-based memory pooling for CXL in cloud datacenters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "python-pptx>=0.6",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "torch>=2.0",
  "tensorboard>=2.14",
  "wandb>=0.16",
  "pandas>=2.0",
  "python-dateutil>=2.8",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "rich>=13.7",
  "jupyterlab>=4.0",
  "ipykernel>=6.0",
]

[project.optional-dependencies]
jax = [
  "jax>=0.4.25",
  "jaxlib>=0.4.25",
  "flax>=0.8.0",
  "optax>=0.2.2",
  "chex>=0.1.86",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["octopus*"]
